# Sovrascrive persistence-db.properties del war: il core su PostgreSQL (database gp) invece di HSQLDB, così gli account
# di insert.sql restano tra un avvio e l'altro. Le tabelle le crea Hibernate (db_hbm2ddlAuto=update).
# Montato in GP_DATA_DIR (/etc/geoplatform).
db_driverClassName=org.postgresql.Driver
db_url=jdbc:postgresql://postgis:5432/gp
db_username=postgres
db_password=0x,postgres,0x
db_databasePlatform=org.hibernate.dialect.PostgreSQLDialect
db_showSql=false
