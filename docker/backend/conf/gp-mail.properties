# Sovrascrive gp-mail.properties (notifiche del layer builder e del CSV importer): le mail vanno a Mailpit
# (http://localhost:8025) invece del server di posta vero. Montato in GP_DATA_DIR (/etc/geoplatform).
gp.mail.host=mailpit
gp.mail.port=1025
gp.mail.username=importer@geoplatform.local
# SMTPMailSpringProperties non accetta una password vuota: Mailpit la ignora (smtp.auth=false)
gp.mail.password=mailpit
gp.mail.smtp.auth=false
gp.mail.smtp.starttls.enable=false
gp.mail.smtp.ssl.enable=false
gp.mail.replayTo=importer@geoplatform.local
gp.mail.layer_builder.geoSDIEmailSupport=core@geoplatform.local
