# Sovrascrive solo le chiavi di gp-ws.properties (geoplatform-base-configurator) che nel container cambiano.
# Montato in GP_DATA_DIR (/etc/geoplatform).
geoserver_url=http://geoserver:8080/geoserver
geoserver_username=admin
geoserver_password=geoserver
geoportal_dir_path=/var/lib/geoplatform/geoportal/
host_postgis_datastore_publisher=postgis
port_postgis_datastore_publisher=5432
db_name_postgis_datastore_publisher=preview_gp
username_db_postgis_datastore_publisher=postgres
password_db_postgis_datastore_publisher=0x,postgres,0x
# Il servizio di tracking si collega a XMPP nel costruttore: verso localhost la connessione viene rifiutata subito,
# invece di aspettare il timeout verso il server esterno.
host_xmpp_server=localhost
default_wfs_datasource=http://geoserver:8080/geoserver/wfs
file_importer_dir=/var/lib/geoplatform/importer
