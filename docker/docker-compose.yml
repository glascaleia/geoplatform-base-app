# GeoPlatform in locale: servizi (geoplatform-service.war su Tomcat 11), PostGIS, GeoServer
# 2.28.4 (la versione V28x del connector), Mailpit e la base app. Prima: ./build-backend.sh e ./build-frontend.sh.
# Avvio: docker compose up -d --build.
name: geoplatform

services:

  postgis:
    image: postgis/postgis:16-3.4
    # l'immagine esiste solo per amd64: sui Mac arm64 gira emulata
    platform: linux/amd64
    environment:
      POSTGRES_PASSWORD: "0x,postgres,0x"
    ports:
      - "5433:5432"
    volumes:
      - ./postgis/init:/docker-entrypoint-initdb.d:ro
      - ./postgis/generated:/geoplatform-sql:ro
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jdbc_template"]
      interval: 5s
      timeout: 5s
      retries: 30

  geoserver:
    image: docker.osgeo.org/geoserver:2.28.4
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
      SKIP_DEMO_DATA: "true"
      # REST Importer, usato dal file importer
      INSTALL_EXTENSIONS: "true"
      STABLE_EXTENSIONS: importer
      # risorsa JNDI dei datastore che crea il layer builder (jdbc.jndiReferenceName del servizio): l'immagine la
      # scrive nel <Context> di geoserver in server.xml, che ha override="true" e quindi ignora conf/context.xml
      POSTGRES_JNDI_ENABLED: "true"
      POSTGRES_JNDI_RESOURCE_NAME: jdbc/postgres_layerbuilder
      POSTGRES_HOST: postgis
      POSTGRES_PORT: "5432"
      POSTGRES_DB: jdbc_template
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: "0x,postgres,0x"
    ports:
      - "8081:8080"
    volumes:
      - geoserver-data:/opt/geoserver_data
      - importer-data:/var/lib/geoplatform/importer
    depends_on:
      postgis:
        condition: service_healthy

  geoplatform-service:
    build: ./backend
    environment:
      CATALINA_OPTS: >-
        -Xmx2g
        -DGP_DATA_DIR=/etc/geoplatform
        -DGP_PERSISTENCE_PBE_KEY=${GP_PERSISTENCE_PBE_KEY:?eseguire prima ./build-backend.sh}
        -Duser.home=/var/lib/geoplatform
    ports:
      - "8080:8080"
    volumes:
      - ./backend/conf:/etc/geoplatform:ro
      - importer-data:/var/lib/geoplatform/importer
    depends_on:
      postgis:
        condition: service_healthy
      geoserver:
        condition: service_started
      mailpit:
        condition: service_started

  # la base app (GWT): http://localhost:9393/BaseApp.html. Prima: ./build-frontend.sh
  baseapp:
    build: ./frontend
    environment:
      CATALINA_OPTS: >-
        -Xmx1g
        -DGP_DATA_DIR=/etc/geoplatform
        -DGP_PERSISTENCE_PBE_KEY=${GP_PERSISTENCE_PBE_KEY:?eseguire prima ./build-backend.sh}
    ports:
      - "9393:8080"
    volumes:
      - ./frontend/conf:/etc/geoplatform:ro
    depends_on:
      geoplatform-service:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

volumes:
  postgis-data:
  geoserver-data:
  importer-data:
