# Configurazione della base app nel container: sovrascrive solo queste chiavi del gp-ws.properties del classpath.
# I servizi si raggiungono dalla rete di compose; il browser invece chiama i servizi REST migrati a Domino su
# http://localhost:8080/geoplatform-service (la service root è ancora scritta nelle interfacce).
webservice_endpoint_address=http://geoplatform-service:8080/geoplatform-service/core
webservice_rs_endpoint_address=http://geoplatform-service:8080/geoplatform-service/jsonCore
webservice_wms_endpoint_address=http://geoplatform-service:8080/geoplatform-service/wms
webservice_rs_wms_endpoint_address=http://geoplatform-service:8080/geoplatform-service/jsonWMS
webservice_publisher_endpoint_address=http://geoplatform-service:8080/geoplatform-service/publish
webservice_rs_publisher_endpoint_address=http://geoplatform-service:8080/geoplatform-service/jsonPublisher
webservice_tracking_endpoint_address=http://geoplatform-service:8080/geoplatform-service/tracking
webservice_catalogfinder_endpoint_address=http://geoplatform-service:8080/geoplatform-service/catalogFinder
webservice_cswservice_endpoint_address=http://geoplatform-service:8080/geoplatform-service/csw
webservice_wfsservice_endpoint_address=http://geoplatform-service:8080/geoplatform-service/wfs
# client REST delle servlet della base app (upload del file e del CSV importer, layer builder)
rest_service_url_path=http://geoplatform-service:8080/geoplatform-service
geoserver_url=http://geoserver:8080/geoserver
geoserver_username=admin
geoserver_password=geoserver
# nessun server XMPP: la connessione viene rifiutata subito invece di aspettare il timeout
host_xmpp_server=localhost
